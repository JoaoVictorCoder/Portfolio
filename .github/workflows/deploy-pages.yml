name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          from flask import Flask, render_template

          project_root = Path(".").resolve()
          output_dir = project_root / "_site"

          if output_dir.exists():
              shutil.rmtree(output_dir)
          output_dir.mkdir(parents=True, exist_ok=True)

          app = Flask(
              __name__,
              template_folder=str(project_root / "templates"),
              static_folder=str(project_root / "static"),
              static_url_path="/static",
          )

          templates_dir = project_root / "templates"
          template_files = sorted(
              p for p in templates_dir.glob("*.html") if p.name != "base.html"
          )

          for template_path in template_files:
              page_name = template_path.stem
              with app.test_request_context("/"):
                  html = render_template(
                      template_path.name,
                      component_css=f"css/components/{page_name}.css",
                  )

              # Keep assets working on both user pages and project pages.
              base_path = "${BASE_PATH}".strip()
              if base_path and base_path != "/":
                  html = html.replace('href="/static/', f'href="{base_path}/static/')
                  html = html.replace('src="/static/', f'src="{base_path}/static/')

              output_file = output_dir / f"{page_name}.html"
              output_file.write_text(html, encoding="utf-8")

          static_src = project_root / "static"
          static_dst = output_dir / "static"
          shutil.copytree(static_src, static_dst, dirs_exist_ok=True)
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
